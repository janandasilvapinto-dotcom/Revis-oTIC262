<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão Ponei: Revisão de TIC</title>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#1c2433; --muted:#5b6578; --line:#dfe4ec;
  --pri:#22385c; --pri2:#2f4d7d; --acc:#f2843a; --acc-soft:#fde9da;
  --ok:#1f9d63; --ok-soft:#dcf3e8; --bad:#d4483b; --bad-soft:#fbe3e0;
  --lock:#b7bfcc; --shadow:0 4px 18px rgba(28,36,51,.08);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.wrap{max-width:920px;margin:0 auto;padding:16px}
/* Topbar */
.top{background:var(--pri);color:#fff;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.top .wrap{padding:10px 16px}
.toprow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{background:var(--acc);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;margin:8px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .5s}
.map{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:thin}
.node{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:4px 10px 4px 6px;font-size:13px}
.node .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:14px}
.node.done{border-color:var(--ok);background:rgba(31,157,99,.25)}
.node.cur{border-color:var(--acc);background:rgba(242,132,58,.25)}
.node.locked{opacity:.45;cursor:not-allowed}
.node .lbl{white-space:nowrap}
/* Cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin:16px 0}
h1{font-size:28px;line-height:1.2;margin:.2em 0 .4em;color:var(--pri)}
h2{font-size:22px;line-height:1.25;margin:.2em 0 .6em;color:var(--pri)}
h3{font-size:17px;margin:.4em 0 .4em;color:var(--pri)}
p{margin:.5em 0}
.lead{font-size:17px}
.muted{color:var(--muted)}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fafbfd}
.box.acc{background:var(--acc-soft);border-color:#f6c9a7}
.box.pri{background:#e8eef8;border-color:#c9d6ec}
.story{border-left:4px solid var(--acc);background:#fff8f2;padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr} h1{font-size:23px} h2{font-size:19px} .card{padding:16px}}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{background:#eef2f8;color:var(--pri);font-size:14px}
.tablewrap{overflow-x:auto}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.chain span{background:#e8eef8;border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px}
.chain b{color:var(--acc)}
.pill{display:inline-block;background:#e8eef8;color:var(--pri);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px;font-weight:600}
/* Buttons */
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--pri);color:#fff;transition:transform .1s,background .2s}
.btn:hover{background:var(--pri2)} .btn:active{transform:scale(.98)}
.btn.acc{background:var(--acc)} .btn.acc:hover{background:#e0732a}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
/* Cover */
.cover{text-align:center;padding:34px 22px}
.cover .big{font-size:64px;line-height:1}
.cover ul{text-align:left;display:inline-block;margin:10px auto}
/* Challenges */
.chhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tagc{background:var(--acc-soft);color:#a24f12;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.q{font-weight:600;font-size:17px;margin:10px 0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;border-radius:10px;padding:10px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);border:1px solid #a9dfc4}
.fb.bad{background:var(--bad-soft);border:1px solid #f1b5ae}
.fb.info{background:#e8eef8;border:1px solid #c9d6ec}
/* Buckets */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:#fafbfd;margin:10px 0}
.chip{border:1.5px solid #c9d6ec;background:#fff;border-radius:10px;padding:8px 11px;font-size:14px;color:var(--ink);user-select:none;touch-action:manipulation}
.chip.sel{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 3px rgba(242,132,58,.25)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.chip.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:96px;background:#fff;transition:border-color .2s,background .2s}
.bucket h4{margin:0 0 6px;font-size:14px;color:var(--pri)}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}
.bucket.target{border-color:var(--acc);background:#fffaf5;cursor:pointer}
.bucket.over{border-color:var(--acc);background:var(--acc-soft)}
.hint{font-size:13px;color:var(--muted)}
/* Match */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
@media (max-width:640px){.match{grid-template-columns:1fr}}
.mcol{display:grid;gap:8px;align-content:start}
.mi{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;color:var(--ink)}
.mi.concept{font-weight:700}
.mi.sel{border-color:var(--acc);background:var(--acc-soft)}
.mi.ok{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mi.bad{border-color:var(--bad);background:var(--bad-soft)}
.mi .n{display:inline-block;min-width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;text-align:center;line-height:22px;margin-right:6px}
/* Flip */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.flip{perspective:900px;height:190px;border:0;background:transparent;padding:0}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center;text-align:left;font-size:14.5px}
.flip .f{background:var(--pri);color:#fff}
.flip .f .tap{font-size:12px;opacity:.75;margin-top:8px}
.flip .b{background:var(--ok-soft);border:1.5px solid #a9dfc4;transform:rotateY(180deg);color:var(--ink);overflow:auto}
/* Cloze */
.cloze{font-size:16.5px;line-height:2.1}
.cloze select{font:inherit;font-size:15px;padding:3px 6px;border-radius:8px;border:1.5px solid #c9d6ec;background:#fff;max-width:100%}
.cloze select.ok{border-color:var(--ok);background:var(--ok-soft)}
.cloze select.bad{border-color:var(--bad);background:var(--bad-soft)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,28,44,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.mbox .badge{font-size:64px;line-height:1.1}
.field{display:block;text-align:left;margin:10px 0}
.field span{display:block;font-size:14px;font-weight:600;color:var(--pri);margin-bottom:4px}
.field input{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:.06em;background:var(--pri);color:#fff;border-radius:12px;padding:14px;text-align:center;word-break:break-all;margin:10px 0}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.badges span{background:#e8eef8;border-radius:10px;padding:6px 10px;font-size:14px}
.foot{text-align:center;font-size:13px;color:var(--muted);padding:10px 16px 30px}
.linkbtn{background:none;border:0;color:var(--pri2);text-decoration:underline;font-size:13px;padding:4px}
.refs{font-size:13.5px;color:var(--muted)}
.refs li{margin:4px 0}
.score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.score div{background:#e8eef8;border-radius:12px;padding:10px 16px;min-width:110px}
.score b{display:block;font-size:24px;color:var(--pri)}
</style>
</head>
<body>
<header class="top" id="top" style="display:none">
  <div class="wrap">
    <div class="toprow">
      <div class="brand">🦄 Missão Ponei · Revisão de TIC</div>
      <div class="xp" id="xp">0 XP</div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <nav class="map" id="map" aria-label="Mapa das fases"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="foot">
  Aula interativa · Tecnologias da Informação e Comunicação · Profª Drª Jananda Pinto<br>
  <button class="linkbtn" id="profBtn">🔑 Área do professor: validar código</button>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
(function(){
'use strict';

/* =========================================================
   ARMAZENAMENTO SEGURO (localStorage com fallback em memória)
   ========================================================= */
var KEY = 'missao_ponei_tic_v2';
var memStore = {};
var store = {
  get: function(k){ try{ var v = window.localStorage.getItem(k); return v; }catch(e){ return memStore.hasOwnProperty(k) ? memStore[k] : null; } },
  set: function(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){ memStore[k]=v; } },
  del: function(k){ try{ window.localStorage.removeItem(k); }catch(e){ delete memStore[k]; } }
};

/* =========================================================
   CONTEÚDO
   ========================================================= */
var PHASES = [
/* ---------------- FASE 1 ---------------- */
{ id:'org', icon:'🏢', title:'TIC nas Organizações', short:'Organizações',
  badge:{icon:'🧭', name:'Estrategista Digital'},
  screens:[
   { t:'Seu primeiro dia na Ponei', h:
    '<div class="story">🦄 <b>Ponei Corporation</b> é uma empresa recifense que fabrica e vende produtos temáticos em lojas físicas, num e-commerce e para revendedores. Você acaba de assumir como <b>gerente de projetos</b> do programa <b>“Ponei Digital 2030”</b>.</div>'+
    '<p class="lead">A CEO, Dona Estrela, abre a reunião: <i>“Os concorrentes estão mais rápidos que nós. O que a tecnologia tem a ver com isso?”</i></p>'+
    '<div class="grid g3">'+
     '<div class="box">⚡ <b>Agilidade</b><br><span class="muted">perceber e agir rápido</span></div>'+
     '<div class="box">🔄 <b>Adaptabilidade</b><br><span class="muted">mudar quando o ambiente muda</span></div>'+
     '<div class="box">📣 <b>Responsividade</b><br><span class="muted">responder a clientes e mercado</span></div>'+
    '</div>'+
    '<p>Essas <b>capacidades organizacionais</b> sustentam a <b>vantagem competitiva</b>. A TIC é uma das principais alavancas para desenvolvê-las.</p>' },
   { t:'Visão Baseada em Recursos (RBV)', h:
    '<p>A RBV defende que a organização obtém vantagem competitiva quando detém recursos com quatro qualidades (Crubellate; Pascucci; Grave, 2008):</p>'+
    '<div class="tablewrap"><table><tr><th>Qualidade</th><th>Pergunta-chave</th><th>Na Ponei…</th></tr>'+
    '<tr><td>💎 Valioso</td><td>Gera valor ao cliente?</td><td>Histórico de preferências dos clientes</td></tr>'+
    '<tr><td>🔍 Raro</td><td>Poucos concorrentes têm?</td><td>15 anos de dados próprios de vendas</td></tr>'+
    '<tr><td>🧬 Inimitável</td><td>É difícil de copiar?</td><td>Dados integrados ao processo de criação de produtos</td></tr>'+
    '<tr><td>🧱 Insubstituível</td><td>Não há equivalente?</td><td>Conhecimento acumulado do time</td></tr></table></div>'+
    '<div class="box acc">💡 Comprar um notebook novo não é raro nem inimitável. Já a <b>forma</b> como a empresa combina dados, processos e pessoas pode ser.</div>' },
   { t:'Tecnologia onipresente… e commodity', h:
    '<p>A tecnologia está em toda parte: TV aberta, YouTube, streaming, redes sociais. Os recursos <b>básicos e comuns</b> estão disponíveis para qualquer empresa.</p>'+
    '<div class="grid g2"><div class="box">🛒 <b>Commodity</b><br>A Ponei e o concorrente podem comprar o mesmo ERP, o mesmo servidor, a mesma nuvem.</div>'+
    '<div class="box pri">🎯 <b>Diferencial</b><br>O que direciona à vantagem competitiva é <b>como</b> a organização utiliza a tecnologia.</div></div>' },
   { t:'Gestão de desempenho e estratégia', h:
    '<div class="grid g3"><div class="box">📏 Gerir com foco no <b>desempenho</b></div><div class="box">📊 <b>Não se gere o que não se mede</b></div><div class="box">🔎 Saber <b>o que o indicador mede</b></div></div>'+
    '<p>A TIC fornece os dados e indicadores para medir. E ela só cria valor quando está <b>alinhada à estratégia organizacional</b>.</p>'+
    '<div class="story">📌 Sua missão nas próximas fases: entender cada elemento da infraestrutura de TIC da Ponei para propor o plano “Ponei Digital 2030”.</div>' }
  ],
  challenges:[
   { type:'mc', title:'Desafio: conselho da diretoria', qs:[
    { q:'A Ponei e sua principal concorrente implantaram exatamente o mesmo ERP. Segundo a ideia de tecnologia como commodity, o que pode gerar vantagem competitiva para a Ponei?',
      o:[ ['Ter instalado o ERP primeiro.', false, 'Chegar antes ajuda pouco: o concorrente pode comprar o mesmo sistema amanhã.'],
          ['A forma como a Ponei usa o ERP, integrando-o aos seus processos, dados e pessoas.', true, 'Isso! A tecnologia básica é comum; o diferencial está em como ela é utilizada.'],
          ['Pagar mais caro pela licença.', false, 'Preço não torna um recurso raro ou difícil de imitar.'],
          ['Nada: se a tecnologia é igual, o resultado também será.', false, 'Não. Com a mesma tecnologia, empresas obtêm resultados diferentes conforme a usam.'] ] },
    { q:'Pela Visão Baseada em Recursos, qual destes recursos da Ponei tem mais potencial de gerar vantagem sustentável?',
      o:[ ['Uma base de dados construída em 15 anos sobre preferências de clientes, usada na criação de produtos.', true, 'Exato: é valiosa, rara, difícil de imitar e de substituir (VRIN).'],
          ['Os 40 notebooks novos do escritório.', false, 'Notebooks são commodities: qualquer concorrente pode comprar.'],
          ['A internet de fibra óptica da sede.', false, 'Útil, mas amplamente disponível no mercado.'],
          ['A assinatura de um pacote de escritório.', false, 'Um recurso comum, acessível a todos.'] ] },
    { q:'Dona Estrela quer “melhorar as entregas”, mas ninguém sabe o tempo médio de entrega atual. Qual princípio está sendo ignorado?',

          ['Não se pode gerir o que não se consegue medir: é preciso definir indicadores e saber o que medem.', true, 'Perfeito. Sem indicador, não há como saber se a entrega melhorou.'],
          ['Recursos insubstituíveis.', false, 'Esse conceito é da RBV e não resolve a questão da medição.'],
          ['Basta comprar um software de logística.', false, 'O software ajuda, mas antes é preciso saber o que medir.'] ] }
   ]}
  ]
},
/* ---------------- FASE 2 ---------------- */
{ id:'infra', icon:'🧩', title:'Os Elementos da Infraestrutura de TIC', short:'Infraestrutura',
  badge:{icon:'🧩', name:'Arquiteto(a) da Infraestrutura'},
  screens:[
   { t:'Que tecnologia estamos discutindo?', h:
    '<p>Quando falamos de TIC na organização, não é só “computador”. Segundo Turban et al. (2015), a infraestrutura tecnológica reúne <b>seis elementos</b> integrados:</p>'+
    '<div class="tablewrap"><table><tr><th>Elemento</th><th>O que é</th><th>Exemplo na Ponei</th></tr>'+
    '<tr><td>🖥️ Hardware</td><td>Equipamentos físicos</td><td>Servidores, caixas das lojas, leitores</td></tr>'+
    '<tr><td>💿 Software</td><td>Programas que fazem o hardware trabalhar</td><td>ERP, sistema operacional</td></tr>'+
    '<tr><td>🌐 Redes</td><td>Conectam e permitem compartilhar recursos</td><td>Wi-Fi das lojas, internet, VPN</td></tr>'+
    '<tr><td>🗄️ Dados</td><td>Fatos registrados que viram informação</td><td>Cadastro de clientes, vendas</td></tr>'+
    '<tr><td>🔄 Processos</td><td>Atividades que geram resultado</td><td>Atender pedido, comprar insumos</td></tr>'+
    '<tr><td>👥 Pessoas (usuários)</td><td>Quem opera, decide e usa</td><td>Vendedores, analistas, gestores</td></tr></table></div>' },
   { t:'Como tudo se encaixa', h:
    '<p>Os <b>processos</b> transformam entradas em saídas usando recursos. A <b>infraestrutura de TIC</b> dá sustentação a esses processos, e tudo isso está a serviço do <b>objetivo organizacional</b> (adaptado de Jeston; Nelis, 2014).</p>'+
    '<div class="chain"><span>📥 Input</span><b>→</b><span>⚙️ PROCESSO (+ recursos)</span><b>→</b><span>📤 Output</span><b>→</b><span>🎯 Objetivo</span></div>'+
    '<div class="box pri">🏗️ Embaixo de tudo: <b>Infraestrutura de TIC</b> (hardware, software, redes, dados, pessoas, processos).</div>'+
    '<div class="story">Na Ponei: um pedido do e-commerce (input) passa por separação, faturamento e envio (processo) até chegar à casa do cliente (output). Para isso funcionar, entram ERP, rede, dados de estoque, equipamentos do CD e pessoas treinadas.</div>' }
  ],
  challenges:[
   { type:'buckets', title:'Desafio: inventário da Ponei', intro:'O Diretor de TI, Caio, entregou uma lista bagunçada. Classifique cada item no elemento da infraestrutura correto.',
     buckets:[['hw','🖥️ Hardware'],['sw','💿 Software'],['net','🌐 Redes'],['dat','🗄️ Dados'],['proc','🔄 Processos'],['ppl','👥 Pessoas']],
     items:[ ['Leitores de código de barras do Centro de Distribuição','hw'],
             ['Servidores do data center','hw'],
             ['Sistema ERP da empresa','sw'],
             ['Sistema operacional dos caixas das lojas','sw'],
             ['Wi-Fi das lojas','net'],
             ['Roteador que liga a sede à internet','net'],
             ['Cadastro de clientes','dat'],
             ['Histórico de vendas dos últimos 5 anos','dat'],
             ['Fluxo de aprovação de compras','proc'],
             ['Atender pedido do e-commerce','proc'],
             ['Analista de BI que monta os painéis','ppl'],
             ['Vendedores que registram os pedidos','ppl'] ] }
  ]
},
/* ---------------- FASE 3 ---------------- */
{ id:'proc', icon:'🔄', title:'Processos', short:'Processos',
  badge:{icon:'⚙️', name:'Mestre dos Processos'},
  screens:[
   { t:'O que é processo?', h:
    '<p class="lead">Processo é um conjunto de <b>atividades sequenciais</b>, com relação lógica entre si, que busca atender (e de preferência superar) as necessidades de clientes internos e externos.</p>'+

var S; // estado persistente
function freshState(){ return { started:false, unlocked:0, done:{}, xp:{}, finished:false, student:null }; }
function load(){ try{ var raw=store.get(KEY); S = raw ? JSON.parse(raw) : freshState(); if(!S || typeof S!=='object') S=freshState(); }catch(e){ S=freshState(); } }
function save(){ try{ store.set(KEY, JSON.stringify(S)); }catch(e){} }

var R = null; // estado da execução atual da fase (não persistente)

/* XP máximo de cada desafio */
function chMax(c){
  switch(c.type){
    case 'mc': return c.qs.length*10;
    case 'buckets': return c.items.length*10;
    case 'match': return c.pairs.length*10;
    case 'flip': return c.cards.length*5;
    case 'decision': return c.sc.length*15;
    case 'tf': return c.st.length*10;
    case 'cloze': return c.parts.filter(function(p){return Array.isArray(p);}).length*10;
  }
  return 0;
}
function phaseMax(p){ return p.challenges.reduce(function(a,c){return a+chMax(c);},0); }
var MAXXP = PHASES.reduce(function(a,p){return a+phaseMax(p);},0);
function chMin(c){
  switch(c.type){
    case 'mc': return c.qs.reduce(function(a,q){ return a+award(q.o.length-1,10,5,2); },0);
    case 'buckets': return c.items.length*2;
    case 'match': return c.pairs.length*2;
    case 'flip': return c.cards.length*5;
    case 'decision': return c.sc.reduce(function(a,s){ return a+award(s.o.length-1,15,7,3); },0);
    case 'tf': return 0;
    case 'cloze': return c.parts.filter(function(p){return Array.isArray(p);}).reduce(function(a,p){ return a+award(p[1].length-1,10,5,2); },0);
  }
  return 0;
}
var MINXP = PHASES.reduce(function(a,p){ return a+p.challenges.reduce(function(b,c){return b+chMin(c);},0); },0);
/* Nota de 0 a 2: o piso (quem só acertou após esgotar as tentativas) vale 0; acertar tudo de primeira vale 2 */
function grade(xp){ var g=(xp-MINXP)/(MAXXP-MINXP)*2; if(g<0) g=0; if(g>2) g=2; return Math.round(g*100)/100; }
function fmtGrade(g){ return g.toFixed(2).replace('.',','); }
function totalXP(){ var t=0; for(var k in S.xp){ if(S.xp.hasOwnProperty(k)) t+=S.xp[k]; } return t; }
function award(tries, full, mid, low){ return tries===0 ? full : (tries===1 ? mid : low); }

var $ = function(s,el){ return (el||document).querySelector(s); };
var app = $('#app');
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function scrollTop(){ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }
function modal(html){ $('#mbox').innerHTML=html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); $('#mbox').innerHTML=''; }
function addXP(n){ if(R && !R.review){ R.xp += n; } updateTop(); }

/* =========================================================
   TOPO: MAPA, BARRA, XP
   ========================================================= */
function updateTop(){
  var top=$('#top');
  if(!S.started){ top.style.display='none'; return; }
  top.style.display='block';
  var live = totalXP() + ((R && !R.review) ? R.xp : 0);
  $('#xp').textContent = live+' / '+MAXXP+' XP';
  var doneCount = PHASES.filter(function(p){return S.done[p.id];}).length;
  $('#bar').style.width = Math.round(doneCount/PHASES.length*100)+'%';
  var m=$('#map'); m.innerHTML='';
  PHASES.forEach(function(p,i){
    var b=document.createElement('button');
    var cls='node';
    if(S.done[p.id]) cls+=' done';
    if(R && R.pi===i) cls+=' cur';
    if(i> S.unlocked) cls+=' locked';
    b.className=cls;
    b.innerHTML='<span class="ic">'+(i>S.unlocked?'🔒':p.icon)+'</span><span class="lbl">'+(i+1)+'. '+esc(p.short)+'</span>';
    b.title = p.title;
    if(i<=S.unlocked){ b.onclick=function(){ startPhase(i); }; }
    else { b.disabled=true; b.setAttribute('aria-disabled','true'); }
    m.appendChild(b);
    if(R && R.pi===i){ setTimeout(function(){ try{ b.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){} },30); }
  });
  if(S.finished){
    var f=document.createElement('button'); f.className='node done'; f.innerHTML='<span class="ic">🏆</span><span class="lbl">Certificado</span>';
    f.onclick=function(){ R=null; renderFinal(); }; m.appendChild(f);
  }
}

   '<div class="box acc" style="text-align:left;margin:10px 0">⚠️ <b>Atenção:</b> a atividade vale <b>nota de 0 a 2</b> e só pode ser feita <b>uma vez</b>. A nota considera os acertos <b>de primeira</b>: leia o conteúdo com calma antes de cada desafio.</div>'+
   '<div class="nav" style="justify-content:center"><button class="btn acc" id="go">'+(cont?'▶ Continuar':'🚀 Começar')+'</button>'+
   '</div>'+
  '</section>';
  $('#go').onclick=function(){
    S.started=true; save();
    if(S.finished){ renderFinal(); return; }
    var i = Math.min(S.unlocked, PHASES.length-1);
    startPhase(i);
  };
}

/* =========================================================
   FASE: CONTEÚDO
   ========================================================= */
function startPhase(i){
  var p=PHASES[i];
  R = { pi:i, step:'content', si:0, ci:0, xp:0, review: !!S.done[p.id] };
  renderPhase();
}
function renderPhase(){
  updateTop();
  var p=PHASES[R.pi];
  if(R.step==='content'){
    var sc=p.screens[R.si];
    var dots=''; for(var k=0;k<p.screens.length;k++){ dots+='<i class="'+(k<=R.si?'on':'')+'"></i>'; }
    app.innerHTML =
     '<section class="card">'+
      '<div class="kicker">'+(p.boss?'Fase final':'Fase '+(R.pi+1))+' · '+p.icon+' '+esc(p.title)+(R.review?' · modo revisão':'')+'</div>'+
      '<h2>'+sc.t+'</h2>'+ sc.h +
      '<div class="nav"><button class="btn ghost" id="prev">← Voltar</button><div class="dots">'+dots+'</div>'+
      '<button class="btn '+(R.si===p.screens.length-1?'acc':'')+'" id="next">'+(R.si===p.screens.length-1?(p.boss?'👑 Enfrentar o chefão':'🎮 Ir para o desafio'):'Avançar →')+'</button></div>'+
     '</section>';
    $('#prev').onclick=function(){ if(R.si>0){ R.si--; renderPhase(); scrollTop(); } else { renderCover(); } };
    $('#next').onclick=function(){ if(R.si<p.screens.length-1){ R.si++; } else { R.step='challenge'; R.ci=0; } renderPhase(); scrollTop(); };
  } else {
    renderChallenge();
  }
}

/* =========================================================
   DESAFIOS
   ========================================================= */
function chShell(c, inner){
  var p=PHASES[R.pi];
  var n = p.challenges.length>1 ? ' ('+(R.ci+1)+'/'+p.challenges.length+')' : '';
  return '<section class="card"><div class="chhead"><div class="kicker">'+p.icon+' '+esc(p.title)+n+'</div><span class="tagc">até '+chMax(c)+' XP</span></div>'+
         '<h2>'+esc(c.title)+'</h2>'+(c.intro?'<p class="muted">'+c.intro+'</p>':'')+inner+
         '<div class="nav"><button class="btn ghost" id="backc">← Rever conteúdo</button><button class="btn acc" id="contc" style="display:none">Continuar →</button></div></section>';
}
function wireShell(){
  $('#backc').onclick=function(){ R.step='content'; R.si=PHASES[R.pi].screens.length-1; renderPhase(); scrollTop(); };
}
function showContinue(){ var b=$('#contc'); b.style.display='inline-block'; b.onclick=nextChallenge; try{ b.focus({preventScroll:true}); }catch(e){} }
function nextChallenge(){
  var p=PHASES[R.pi];
  if(R.ci < p.challenges.length-1){ R.ci++; renderChallenge(); scrollTop(); }
  else completePhase();
}
function renderChallenge(){
  var c=PHASES[R.pi].challenges[R.ci];
  ({mc:chMC, buckets:chBuckets, match:chMatch, flip:chFlip, decision:chDecision, tf:chTF, cloze:chCloze})[c.type](c);
}

/* ---- Classificar em categorias (arrastar ou tocar) ---- */
function chBuckets(c){
  var items=shuffle(c.items.map(function(it,k){return {id:'i'+k, text:it[0], ans:it[1], at:null, tries:0, locked:false};}));
  var sel=null;
  var bh = c.buckets.map(function(b){return '<div class="bucket" data-b="'+b[0]+'"><h4>'+b[1]+'</h4><div class="in"></div></div>';}).join('');
  app.innerHTML = chShell(c,
    '<p class="hint">💡 Arraste os itens até a categoria ou <b>toque no item e depois na categoria</b>. Toque na área tracejada para devolver um item.</p>'+
    '<div class="pool" id="pool" data-b=""></div><div class="buckets">'+bh+'</div>'+
    '<div class="nav" style="margin-top:12px"><span class="hint" id="cnt"></span><button class="btn" id="chk" disabled>✔ Verificar</button></div><div id="fb"></div>');
  wireShell();
  function zone(b){ return b ? $('.bucket[data-b="'+b+'"] .in') : $('#pool'); }
  function draw(){
    $('#pool').innerHTML=''; Array.prototype.forEach.call(document.querySelectorAll('.bucket .in'),function(z){z.innerHTML='';});
    items.forEach(function(it){
      var el=document.createElement('button'); el.className='chip'+(it.locked?' ok':'')+(sel===it.id?' sel':''); el.textContent=(it.locked?'✓ ':'')+it.text; el.dataset.id=it.id;
      if(!it.locked){
        el.draggable=true;
        el.addEventListener('dragstart',function(e){ try{ e.dataTransfer.setData('text/plain',it.id); e.dataTransfer.effectAllowed='move'; }catch(_){} sel=it.id; });
        el.onclick=function(ev){ ev.stopPropagation(); if(sel && sel!==it.id && it.at){ place(sel, it.at); return; } sel = (sel===it.id? null : it.id); draw(); };
      } else { el.setAttribute('aria-disabled','true'); el.onclick=function(ev){ ev.stopPropagation(); if(sel) place(sel, it.at); }; }
      zone(it.at).appendChild(el);
    });
    var placed=items.filter(function(i){return i.at;}).length;
    $('#cnt').textContent=placed+' de '+items.length+' itens classificados';
    $('#chk').disabled = placed<items.length;
    Array.prototype.forEach.call(document.querySelectorAll('.bucket'),function(b){ b.classList.toggle('target', !!sel); });
  }
  function place(id,b){ var it=items.filter(function(x){return x.id===id;})[0]; if(!it||it.locked) return; it.at=b||null; sel=null; draw(); }
  Array.prototype.forEach.call(document.querySelectorAll('.bucket, #pool'),function(z){
    z.addEventListener('click',function(){ if(sel) place(sel, z.dataset.b); });
    z.addEventListener('dragover',function(e){ e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave',function(){ z.classList.remove('over'); });
    z.addEventListener('drop',function(e){ e.preventDefault(); z.classList.remove('over'); var id=''; try{ id=e.dataTransfer.getData('text/plain'); }catch(_){} place(id||sel, z.dataset.b); });
  });
  $('#chk').onclick=function(){
    var wrong=[], gained=0;
    items.forEach(function(it){
      if(it.locked) return;
      if(it.at===it.ans){ it.locked=true; gained+=award(it.tries,10,5,2); }
      else { it.tries++; it.at=null; wrong.push(it.id); }
    });
    addXP(gained); sel=null; draw();
    wrong.forEach(function(id){ var el=$('.chip[data-id="'+id+'"]'); if(el){ el.classList.add('shake'); } });
    if(wrong.length===0){ $('#fb').innerHTML='<div class="fb ok">✅ Tudo certo! Cada item está no elemento correto.</div>'; $('#chk').style.display='none'; showContinue(); }
    else $('#fb').innerHTML='<div class="fb bad">🔁 '+wrong.length+' item(ns) voltaram para a área tracejada: estavam na categoria errada. Os acertos ficaram travados em verde. Tente de novo!</div>';
  };
  draw();
}

/* ---- Conectar conceito ↔ definição ---- */
function chMatch(c){
  var pairs=c.pairs.map(function(p,k){return {k:k, c:p[0], d:p[1], tries:0, ok:false};});
  var L=shuffle(pairs), Rr=shuffle(pairs), selL=null, selR=null, num=0;
  app.innerHTML = chShell(c,'<div class="match"><div class="mcol" id="ml"></div><div class="mcol" id="mr"></div></div><div id="fb"></div>');
  wireShell();
  function draw(){
    var ml=$('#ml'), mr=$('#mr'); ml.innerHTML=''; mr.innerHTML='';
    L.forEach(function(p){ var b=document.createElement('button'); b.className='mi concept'+(p.ok?' ok':'')+(selL===p.k?' sel':''); b.innerHTML=(p.ok?'<span class="n">'+p.n+'</span>':'')+esc(p.c); b.dataset.k=p.k; if(p.ok) b.disabled=true; else b.onclick=function(){ selL=(selL===p.k?null:p.k); test(); }; ml.appendChild(b); });
    Rr.forEach(function(p){ var b=document.createElement('button'); b.className='mi'+(p.ok?' ok':'')+(selR===p.k?' sel':''); b.innerHTML=(p.ok?'<span class="n">'+p.n+'</span>':'')+esc(p.d); b.dataset.k=p.k; if(p.ok) b.disabled=true; else b.onclick=function(){ selR=(selR===p.k?null:p.k); test(); }; mr.appendChild(b); });
  }
  function test(){
    if(selL!==null && selR!==null){
      var p=pairs[selL];
      if(selL===selR){ p.ok=true; p.n=++num; addXP(award(p.tries,10,5,2)); $('#fb').innerHTML='<div class="fb ok">✅ <b>'+esc(p.c)+'</b>: '+esc(p.d)+'</div>'; selL=selR=null; draw();
        if(num===pairs.length){ $('#fb').innerHTML='<div class="fb ok">🎉 Todos os pares conectados!</div>'; showContinue(); } return; }
      p.tries++; var a=selL, b=selR; selL=selR=null; draw();
      var e1=$('#ml .mi[data-k="'+a+'"]'), e2=$('#mr .mi[data-k="'+b+'"]');
      [e1,e2].forEach(function(e){ if(e){ e.classList.add('bad','shake'); setTimeout(function(){ e.classList.remove('bad','shake'); },700);} });
      $('#fb').innerHTML='<div class="fb bad">❌ Esse par não combina. Tente outra definição para <b>'+esc(p.c)+'</b>.</div>';
      return;
    }
    draw();
  }
  draw();
}

function chTF(c){

    if(typeof p==='string') html+=esc(p);
    else { var k=blanks.length; blanks.push({ans:p[0], tries:0, ok:false});

  });
  html+='</div><div class="nav"><span class="hint" id="cnt"></span><button class="btn" id="chk">✔ Verificar</button></div><div id="fb"></div>';

    else $('#fb').innerHTML='<div class="fb bad">'+(wrong?'🔁 '+wrong+' lacuna(s) em vermelho estão incorretas. ':'')+(empty?'✏️ '+empty+' lacuna(s) ainda vazia(s). ':'')+'Ajuste e verifique novamente.</div>';
  };
}

function completePhase(){

}

/* =========================================================
   CÓDIGO VALIDADOR
   ========================================================= */
var SALT='PONEI|TIC|REVISAO|2026|JP';
function cyrb53(str, seed){
  var h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(var i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function normName(n){ var s=String(n||''); try{ s=s.normalize('NFD').replace(/[̀-ͯ]/g,''); }catch(e){} return s.toLowerCase().replace(/\s+/g,' ').trim(); }
function sig(name, ncode, stamp){
  var h=cyrb53(SALT+'#'+normName(name)+'#'+ncode+'#'+stamp, 2026).toString(36).toUpperCase();
  while(h.length<7) h='0'+h; return h.slice(-7);
}
function nowStamp(){ var d=new Date(); function z(n){return (n<10?'0':'')+n;} return String(d.getFullYear()).slice(2)+z(d.getMonth()+1)+z(d.getDate())+z(d.getHours())+z(d.getMinutes()); }
function fmtStamp(s){ return s.slice(4,6)+'/'+s.slice(2,4)+'/20'+s.slice(0,2)+' às '+s.slice(6,8)+'h'+s.slice(8,10); }
function makeCode(name, nota, stamp){ var p=String(Math.round(nota*100)); while(p.length<3) p='0'+p; return 'PONEI-'+p+'-'+stamp+'-'+sig(name,p,stamp); }
function checkCode(name, code){
  var m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^PONEI-(\d{3})-(\d{10})-([0-9A-Z]{7})$/);
  if(!m) return {ok:false, why:'Formato inválido. O código deve ser como PONEI-145-2611051432-ABC1234.'};
  if(sig(name,m[1],m[2])!==m[3]) return {ok:false, why:'Código inválido: não confere com o nome informado ou foi alterado.'};
  var n=parseInt(m[1],10)/100; if(n>2) return {ok:false, why:'Código inválido.'};
  return {ok:true, nota:n, when:fmtStamp(m[2])};
}

      var t=st.code, done=function(){ $('#copy').textContent='✅ Copiado!'; };
      try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,fallback); } else fallback(); }catch(e){ fallback(); }
      function fallback(){ try{ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }catch(e){ $('#copy').textContent='Selecione e copie manualmente'; } }
    };
  } else {
    $('#gen').onclick=function(){
      var n=$('#nm').value.trim();
      if(normName(n).split(' ').length<2){ $('#err').innerHTML='<div class="fb bad">Digite seu nome completo (nome e sobrenome).</div>'; return; }
      var stp=nowStamp(); S.student={name:n, stamp:stp, code:makeCode(n,nota,stp)}; save(); renderFinal();
    };
  }
}

/* =========================================================
   ÁREA DO PROFESSOR
   ========================================================= */
$('#profBtn').onclick=function(){
  modal('<div class="badge">🔑</div><h2>Validar código</h2><p class="muted">Digite os dados enviados pelo estudante.</p>'+
   '<label class="field"><span>Nome completo</span><input id="vn"></label>'+
   '<label class="field"><span>Código</span><input id="vc" placeholder="PONEI-000-0000000000-XXXXXXX"></label><div id="vr"></div>'+
   '<div class="nav" style="justify-content:center"><button class="btn ghost" id="vx">Fechar</button><button class="btn acc" id="vgo">Validar</button></div>');
  $('#vx').onclick=closeModal;
  $('#vgo').onclick=function(){
    var r=checkCode($('#vn').value,$('#vc').value);
    $('#vr').innerHTML = r.ok ? '<div class="fb ok">✅ <b>Código válido.</b><br>Nota: <b>'+fmtGrade(r.nota)+'</b> (de 0 a 2)<br>Concluído em '+r.when+'</div>' : '<div class="fb bad">❌ '+r.why+'</div>';
  };
};
$('#modal').addEventListener('click',function(e){ if(e.target.id==='modal' && !$('#mgo')) closeModal(); });

/* =========================================================
   INÍCIO
   ========================================================= */
load();
renderCover();
})();
</script>
